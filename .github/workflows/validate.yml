name: Validate

# Pre-tag gate. Release (release.yml) fires on tag push and does not depend on this
# workflow, so this is the only place where a broken tree is caught before a tag
# becomes public.
#
# `develop` is included in the push triggers on purpose: this repository releases
# from `main` but develops on `develop`, so a main-only trigger would give its first
# signal after the merge that immediately precedes the tag.
#
# `cargo fmt --check` and the Rust unit tests are desktop CI gates; clippy remains the
# warning gate. The tracked Rust source is kept rustfmt-clean locally as well.

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  # Parity with release.yml: keeps JavaScript actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser:
    name: Browser single HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check CLAUDE.md structure
        run: node scripts/check-claude-md.mjs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check workflow and documentation contracts
        run: node scripts/ci/check-workflows.mjs

      # The app is one HTML file with its runtime in inline <script> blocks, so a
      # syntax error produces a page that loads and does nothing. Compile it.
      - name: Check inline JavaScript syntax (source HTML)
        run: node scripts/ci/check-html-inline-js.mjs apps/browser/offline-md-editor-viewer.html

      - name: Check Browser runtime safety contracts
        run: node scripts/ci/check-browser-runtime-safety.mjs

      - name: Run tracked browser and boundary tests
        run: |
          node scripts/ci/test-browser-editor-state.mjs
          node scripts/ci/test-browser-file-operations.mjs
          node scripts/ci/test-browser-regex-worker.mjs
          node scripts/ci/test-tauri-filesystem-contracts.mjs
          node scripts/ci/test-tauri-ipc-lifecycle-contracts.mjs
          node scripts/ci/test-npm-launcher.mjs

      # Same script CI uses to produce the release asset: verifies that no
      # placeholder is left unreplaced, no `<script src=` survives inlining, and
      # the bundled license texts are present.
      - name: Build and verify single HTML
        shell: pwsh
        run: ./scripts/release/build-browser-single-html.ps1 -Clean -Verify

      # Inlining rewrites the script blocks, so the generated file is checked too.
      - name: Check inline JavaScript syntax (generated single HTML)
        run: node scripts/ci/check-html-inline-js.mjs dist/browser/offline-md-editor-viewer.html

  consistency:
    name: Version and MSIX manifest consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check version and MSIX manifest consistency
        shell: pwsh
        run: ./scripts/ci/check-consistency.ps1

  desktop:
    name: Windows desktop lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-23)
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Rust format
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri

      - name: Rust unit tests
        run: cargo test --all-targets
        working-directory: apps/desktop/src-tauri

      # tauri.conf.json has no beforeBuildCommand and points frontendDist at the
      # tracked apps/browser directory, so clippy needs no npm install or staging.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
